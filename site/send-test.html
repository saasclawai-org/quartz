<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quartz Send Test</title></head>
<body style="font-family:monospace;padding:16px;max-width:520px;margin:0 auto;font-size:14px">
<h2>🔮 Quartz Send Test</h2>
<p>Crypto verified against the node's reference implementation (BIP39 → SLIP-0010 → Ed25519 → Base58).</p>
<p>To: <input id="to" style="width:100%" value="Qk6QSGe2TtBc3cDLtBHmZMg5CHAbGm4n4U"></p>
<p>Amount: <input id="amt" style="width:100px" value="1"> QZ</p>
<p>Seed (12 words): <input id="seed" style="width:100%" placeholder="your 12 word seed phrase" autocomplete="off"></p>
<button onclick="doSend()" style="padding:12px 24px;font-size:16px">Derive &amp; Send</button>
<pre id="out" style="margin-top:16px;background:#f0f0f0;padding:12px;white-space:pre-wrap;word-break:break-all"></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl.min.js"></script>
<script>
const enc = new TextEncoder();
const hex = u8 => Array.from(u8).map(b => b.toString(16).padStart(2,'0')).join('');
function log(m){ document.getElementById('out').textContent += m + '\n'; }
async function hmac512(keyBytes, dataBytes){
  const k = await crypto.subtle.importKey('raw', keyBytes, {name:'HMAC', hash:'SHA-512'}, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', k, dataBytes));
}
async function deriveKeys(wordsStr){
  const mnemonic = wordsStr.trim().split(/\s+/).join(' ');
  // BIP39: PBKDF2-HMAC-SHA512, salt "mnemonic", 2048 iters, 64 bytes
  const base = await crypto.subtle.importKey('raw', enc.encode(mnemonic), 'PBKDF2', false, ['deriveBits']);
  const seed = new Uint8Array(await crypto.subtle.deriveBits(
    {name:'PBKDF2', hash:'SHA-512', salt: enc.encode('mnemonic'), iterations: 2048}, base, 512));
  // SLIP-0010 Ed25519 master
  let I = await hmac512(enc.encode('ed25519 seed'), seed);
  let k = I.slice(0,32), c = I.slice(32);
  async function child(k, c, index){
    const data = new Uint8Array(37);
    data.set([0],0); data.set(k,1);
    new DataView(data.buffer).setUint32(33, index, false);
    const I = await hmac512(c, data);
    return [I.slice(0,32), I.slice(32)];
  }
  [k,c] = await child(k,c, 44  + 0x80000000);  // m/44'
  [k,c] = await child(k,c, 789  + 0x80000000);  // m/44'/789'
  [k,c] = await child(k,c, 0    + 0x80000000);  // account 0'
  [k,c] = await child(k,c, 0    + 0x80000000);  // chain 0'
  [k,c] = await child(k,c, 0    + 0x80000000);  // index 0'
  const kp = nacl.sign.keyPair.fromSeed(k);
  return { seed, priv: k, pub: kp.publicKey, secret: kp.secretKey };
}
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function base58(buf){
  let num = 0n; for (const b of buf) num = (num << 8n) | BigInt(b);
  let s = "";
  while (num > 0n){ const r = num % 58n; num /= 58n; s = B58[Number(r)] + s; }
  for (const b of buf){ if (b === 0) s = '1' + s; else break; }
  return s;
}
async function addressFromPub(pub){
  const sha = buf => crypto.subtle.digest('SHA-256', buf).then(h => new Uint8Array(h));
  const h = await sha(pub);
  const payload = new Uint8Array(21);
  payload.set([0x3B], 0); payload.set(h.slice(0,20), 1);
  const cs = await sha(await sha(payload));
  const full = new Uint8Array(25);
  full.set(payload); full.set(cs.slice(0,4), 21);
  return base58(full);
}
async function doSend(){
  document.getElementById('out').textContent = '';
  const to = document.getElementById('to').value.trim();
  const amt = parseFloat(document.getElementById('amt').value);
  const seedStr = document.getElementById('seed').value.trim();
  if (!seedStr || seedStr.split(/\s+/).length !== 12){ log('ERROR: enter the 12-word seed'); return; }
  try {
    log('Deriving keypair (PBKDF2 2048 + SLIP-0010)...');
    const { priv, pub, secret } = await deriveKeys(seedStr);
    const from = await addressFromPub(pub);
    log('Derived address: ' + from);
    if (!from.startsWith('Q') && !from.startsWith('R')) log('⚠ unexpected address prefix');
    const sats = Math.round(amt * 1e8);
    const msg = `${from}${to}${sats}`;
    log('Signing: ' + msg);
    const sig = nacl.sign.detached(enc.encode(msg), secret);
    log('POST /api/v1/send ...');
    const resp = await fetch('/api/v1/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ from, to, amount: amt, signature: hex(sig), public_key: hex(pub), message: hex(enc.encode(msg)) })
    });
    const text = await resp.text();
    log('HTTP ' + resp.status + ': ' + text);
    if (resp.ok){
      const b = await fetch('/api/v1/balance/' + from).then(r => r.json());
      log('Balance after send: ' + JSON.stringify(b));
    }
  } catch (e) {
    log('ERROR: ' + (e.message || e));
  }
}
</script>
</body></html>
